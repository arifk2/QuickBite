<style>
#cd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#cd svg.classDiagram .row-rect-odd path,
#cd svg.classDiagram .row-rect-odd rect,
#cd svg.classDiagram .row-rect-even path,
#cd svg.classDiagram .row-rect-even rect { stroke: none !important; }
#cd-wrap { overflow-x: auto; }
</style>
<div id="cd-wrap"><div id="cd"></div></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
direction TB

class OrderIdGenerator {
  <<Singleton>>
  -static instance OrderIdGenerator
  -counter long
  -OrderIdGenerator()
  +static getInstance() OrderIdGenerator
  +generateOrderId() String
}
class PlatformConfig {
  <<Singleton>>
  -static instance PlatformConfig
  -taxRate double
  -deliveryRadiusKm double
  -PlatformConfig()
  +static getInstance() PlatformConfig
  +getTaxRate() double
  +getDeliveryRadiusKm() double
}

class MenuComponent {
  <<abstract>>
  #name String
  +getName() String
  +getPrice() double
  +getItemCount() int
}
class Category {
  -children List~MenuComponent~
  +add(MenuComponent)
  +remove(MenuComponent)
  +getPrice() double
  +getItemCount() int
}
class MenuItem {
  -basePrice double
  -description String
  +getPrice() double
  +getItemCount() int
}

class MenuItemDecorator {
  <<abstract>>
  #wrappedItem MenuComponent
  +getPrice() double
  +getDescription() String
}
class ExtraCheeseDecorator {
  -cheesePrice double
  +getPrice() double
  +getDescription() String
}
class ExtraToppingDecorator {
  -toppingPrice double
  -toppingName String
  +getPrice() double
  +getDescription() String
}
class PackagingDecorator {
  -packagingCost double
  -packagingType String
  +getPrice() double
  +getDescription() String
}

class OrderBuilder {
  -items List~MenuComponent~
  -customer Customer
  -deliveryAddress Address
  -paymentMethod String
  -deliverySlot DeliverySlot
  +setItems(items) OrderBuilder
  +setCustomer(c) OrderBuilder
  +setAddress(a) OrderBuilder
  +setPaymentMethod(m) OrderBuilder
  +setDeliverySlot(s) OrderBuilder
  +build() Order
  -validateMandatoryFields()
}
class Order {
  -orderId String
  -items List~MenuComponent~
  -customer Customer
  -deliveryAddress Address
  -paymentMethod String
  -deliverySlot DeliverySlot
  -currentState OrderState
  -observers List~OrderObserver~
  -history List~String~
  -deliveryFee double
  +setState(s OrderState)
  +subscribe(o OrderObserver)
  +unsubscribe(o OrderObserver)
  +notifyObservers(status String)
  +next()
  +cancel(reason String)
  +getStatus() String
  +addHistory(event String)
  +applyDeliveryFeeStrategy(s DeliveryFeeStrategy)
}

class ValidationHandler {
  <<abstract>>
  #nextHandler ValidationHandler
  +setNext(h ValidationHandler) ValidationHandler
  +handle(order Order)
}
class ItemAvailabilityHandler { +handle(order Order) }
class DeliveryZoneHandler { +handle(order Order) }
class PaymentPreCheckHandler { +handle(order Order) }
class FraudCheckHandler { +handle(order Order) }

class OrderState {
  <<interface>>
  +next(order Order)
  +cancel(order Order, reason String)
  +getStatus() String
}
class PlacedState { +next(Order) +cancel(Order,String) +getStatus() String }
class ConfirmedState { +next(Order) +cancel(Order,String) +getStatus() String }
class PreparingState { +next(Order) +cancel(Order,String) +getStatus() String }
class OutForDeliveryState { +next(Order) +cancel(Order,String) +getStatus() String }
class DeliveredState { +next(Order) +cancel(Order,String) +getStatus() String }
class CancelledState { +next(Order) +cancel(Order,String) +getStatus() String }

class OrderObserver {
  <<interface>>
  +update(order Order, status String)
}
class CustomerAppObserver { +update(Order,String) }
class RestaurantDashboardObserver { +update(Order,String) }
class DeliveryPartnerAppObserver { +update(Order,String) }

class PaymentProcessorFactory {
  +static createProcessor(method String) PaymentProcessor
}
class PaymentProcessor {
  <<interface>>
  +pay(amount double) boolean
}
class CreditCardProcessor { +pay(double) boolean }
class UPIProcessor { +pay(double) boolean }
class WalletProcessor { +pay(double) boolean }
class CashOnDeliveryProcessor { +pay(double) boolean }

class DeliveryPartnerService {
  <<interface>>
  +findNearbyPartner(loc Address) DeliveryPartner
}
class RealDeliveryPartnerService {
  +findNearbyPartner(loc Address) DeliveryPartner
}
class DeliveryPartnerServiceProxy {
  -realService RealDeliveryPartnerService
  -cache Map~String,DeliveryPartner~
  +findNearbyPartner(loc Address) DeliveryPartner
  +reassignPartner(loc Address, role String) DeliveryPartner
  -checkAdminAccess(role String) boolean
}

class DeliveryFeeStrategy {
  <<interface>>
  +calculateFee(distanceKm double, time LocalTime) double
}
class FlatFeeStrategy { +calculateFee(double,LocalTime) double }
class DistanceBasedFeeStrategy { +calculateFee(double,LocalTime) double }
class PeakHourSurgeStrategy { +calculateFee(double,LocalTime) double }

MenuComponent <|-- Category
MenuComponent <|-- MenuItem
Category o-- MenuComponent : children

MenuItemDecorator ..|> MenuComponent
MenuItemDecorator o-- MenuComponent : wraps
ExtraCheeseDecorator --|> MenuItemDecorator
ExtraToppingDecorator --|> MenuItemDecorator
PackagingDecorator --|> MenuItemDecorator

OrderBuilder --> OrderIdGenerator : uses
OrderBuilder ..> Order : builds
Order o-- MenuComponent : items
Order --> OrderState : currentState
Order o-- OrderObserver : observers
Order --> DeliveryFeeStrategy : uses

ValidationHandler <|-- ItemAvailabilityHandler
ValidationHandler <|-- DeliveryZoneHandler
ValidationHandler <|-- PaymentPreCheckHandler
ValidationHandler <|-- FraudCheckHandler
ValidationHandler o-- ValidationHandler : next
ValidationHandler ..> Order : validates

OrderState <|.. PlacedState
OrderState <|.. ConfirmedState
OrderState <|.. PreparingState
OrderState <|.. OutForDeliveryState
OrderState <|.. DeliveredState
OrderState <|.. CancelledState

OrderObserver <|.. CustomerAppObserver
OrderObserver <|.. RestaurantDashboardObserver
OrderObserver <|.. DeliveryPartnerAppObserver

PaymentProcessorFactory ..> PaymentProcessor : creates
PaymentProcessor <|.. CreditCardProcessor
PaymentProcessor <|.. UPIProcessor
PaymentProcessor <|.. WalletProcessor
PaymentProcessor <|.. CashOnDeliveryProcessor
ConfirmedState ..> PaymentProcessorFactory : uses

DeliveryPartnerService <|.. RealDeliveryPartnerService
DeliveryPartnerService <|.. DeliveryPartnerServiceProxy
DeliveryPartnerServiceProxy --> RealDeliveryPartnerService : delegates
OutForDeliveryState ..> DeliveryPartnerServiceProxy : uses

DeliveryFeeStrategy <|.. FlatFeeStrategy
DeliveryFeeStrategy <|.. DistanceBasedFeeStrategy
DeliveryFeeStrategy <|.. PeakHourSurgeStrategy
`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#cd svg.classDiagram .row-rect-odd path, #cd svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
